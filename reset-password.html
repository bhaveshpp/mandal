<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14302B">
  <title>અભરામપરા વ્યાસ પરિવાર</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="common.js"></script>
  <link rel="stylesheet" href="common.css">
</head>

<body class="min-h-screen bg-paper font-sans text-ink antialiased">
  <header id="appHeader"></header>

  <main class="mx-auto max-w-md px-4 pb-16 pt-6">
    <section class="card" style="padding:1.25rem">
      <h2 class="text-xl font-bold">પાસવર્ડ બદલો / Change Password</h2>

      <form id="pwForm" class="mt-5 space-y-4" novalidate>
        <div>
          <label for="pwOld" class="lbl">હાલનો પાસવર્ડ / Current Password</label>
          <div class="relative">
            <input id="pwOld" class="field" style="padding-right:6rem" type="password" autocomplete="current-password" required>
            <button type="button" data-toggle="pwOld" class="absolute inset-y-0 right-0 px-3 text-sm font-medium"
                    style="color:rgba(20,48,43,.7);background:none;border:0;cursor:pointer">બતાવો / Show</button>
          </div>
        </div>
        <div>
          <label for="pwNew" class="lbl">નવો પાસવર્ડ / New Password</label>
          <div class="relative">
            <input id="pwNew" class="field" style="padding-right:6rem" type="password" autocomplete="new-password"
                   minlength="6" placeholder="At least 6 characters" required>
            <button type="button" data-toggle="pwNew" class="absolute inset-y-0 right-0 px-3 text-sm font-medium"
                    style="color:rgba(20,48,43,.7);background:none;border:0;cursor:pointer">બતાવો / Show</button>
          </div>
        </div>
        <div>
          <label for="pwConfirm" class="lbl">નવો પાસવર્ડ ફરી લખો / Confirm New Password</label>
          <div class="relative">
            <input id="pwConfirm" class="field" style="padding-right:6rem" type="password" autocomplete="new-password" required>
            <button type="button" data-toggle="pwConfirm" class="absolute inset-y-0 right-0 px-3 text-sm font-medium"
                    style="color:rgba(20,48,43,.7);background:none;border:0;cursor:pointer">બતાવો / Show</button>
          </div>
        </div>
        <button id="pwBtn" type="submit" class="btn btn-primary w-full">
          <span data-spin class="spinner hidden"></span>
          પાસવર્ડ બદલો / Update Password
        </button>
      </form>
    </section>
  </main>

<script>
(() => {
  'use strict';
  const session = App.requireLogin();
  if (!session) return;

  const { $, call, isAuthError, setBusy, toast, saveSession, flash } = App;
  App.renderSubHeader($('appHeader'));

  $('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const oldPw = $('pwOld').value;
    const newPw = $('pwNew').value;
    const confirmPw = $('pwConfirm').value;

    if (!oldPw || !newPw) { toast('Fill in all password fields. / બધા ખાના ભરો.', 'error'); return; }
    if (newPw.length < 6) { toast('New password must be at least 6 characters. / ઓછામાં ઓછા 6 અક્ષર.', 'error'); return; }
    if (newPw !== confirmPw) { toast('New passwords do not match. / પાસવર્ડ મેળ ખાતા નથી.', 'error'); return; }
    if (newPw === oldPw) { toast('New password must be different. / નવો પાસવર્ડ અલગ રાખો.', 'error'); return; }

    const btn = $('pwBtn');
    setBusy(btn, true);
    try {
      const data = await call('update_password', { old_password: oldPw, new_password: newPw });
      // the old token died with the old password; store the fresh one
      saveSession(Object.assign({}, session, { token: data.token, exp: data.expires }));
      $('pwForm').reset();
      flash('Password updated! / પાસવર્ડ બદલાઈ ગયો!');
      location.replace('home.html');
    } catch (err) {
      if (!isAuthError(err)) {
        toast(err.code === 'wrong_password' ? 'Current password is incorrect. / હાલનો પાસવર્ડ ખોટો છે.' : err.message, 'error');
      }
      setBusy(btn, false);
    }
  });
})();
</script>
</body>
</html>
